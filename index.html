<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retro CRT Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/os.css" />
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>
    <button id="hint" class="hint" type="button">click the screen to enter ↵</button>
    <button id="mute" class="mute" type="button" aria-pressed="false">sound: on</button>
    <button id="tilt" class="mute tilt" type="button" hidden>enable tilt</button>
    <div id="os" hidden></div>
    <div id="prism" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
